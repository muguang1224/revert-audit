<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="revert-audit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="8" height="300" fill="url(#accent)"/>

  <text x="72" y="118" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" letter-spacing="-2">revert-audit</text>
  <text x="74" y="164" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">CI's blind spot, measured</text>
  <text x="74" y="214" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">zero dependencies · GitHub REST · ETag cache · Python 3.10–3.14</text>

  <g transform="translate(748 54)">
    <rect x="0" y="0" width="380" height="192" rx="16" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="32" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">history</text>

    <line x1="24" y1="92" x2="356" y2="92" stroke="#334155" stroke-width="2"/>
    <circle cx="44" cy="92" r="7" fill="#34d399"/>
    <circle cx="92" cy="92" r="7" fill="#34d399"/>
    <circle cx="140" cy="92" r="7" fill="#34d399"/>
    <circle cx="188" cy="92" r="7" fill="#ef4444"/>
    <circle cx="236" cy="92" r="7" fill="#34d399"/>
    <circle cx="284" cy="92" r="7" fill="#34d399"/>
    <circle cx="332" cy="92" r="7" fill="#34d399"/>

    <path d="M 188 82 C 188 52, 140 52, 140 72" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 136 68 L 140 76 L 146 69" fill="none" stroke="#f59e0b" stroke-width="2"/>

    <text x="24" y="132" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">green checks</text>
    <text x="152" y="132" fill="#f59e0b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">reverted later</text>

    <text x="24" y="166" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">18 / 28 reverted changes</text>
    <text x="24" y="184" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">had passing CI at the time</text>
  </g>
</svg>
